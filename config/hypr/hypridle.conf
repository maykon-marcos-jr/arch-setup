general {
    # dbus/sysd lock command (loginctl lock-session)
    lock_cmd = pidof hyprlock || hyprlock               # avoid starting multiple hyprlock instances.
    # before_sleep_cmd = loginctl lock-session          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = on})'        # command ran after sleep
    inhibit_sleep = 2                                   #
    ignore_dbus_inhibit = false                         # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false                      # whether to ignore systemd-inhibit --what=idle inhibitors
}

# if the screen is locked, wait only 30 seconds and turn off the screen
listener {
    timeout = 30
    on-timeout = bash -c "if pgrep -x hyprlock >/dev/null; then hyprctl dispatch 'hl.dsp.dpms({action = off})'; fi" # turn off monitor
    on-resume = bash -c "if pgrep -x hyprlock >/dev/null; then hyprctl dispatch 'hl.dsp.dpms({action = on})'; fi" # monitor restore.
}

